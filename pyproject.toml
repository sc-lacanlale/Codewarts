[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fsl-sign-language-translator"
version = "0.1.0"
description = "Real-time Filipino Sign Language recognition from MediaPipe Holistic landmarks, with Tagalog speech."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Shanley Clarence Lacanlale" },
  { name = "certainlynotnathan" },
  { name = "ryvxz" },
]
dependencies = [
  "numpy==1.26.4",
  "scipy==1.17.1",
  "scikit-learn==1.6.1",
  "joblib==1.6.0",
  "tensorflow==2.21.0",
  "keras==3.15.1",
]

[project.optional-dependencies]
app = [
  "mediapipe==0.10.35",
  "opencv-contrib-python==4.11.0.86",
  "pillow==13.0.0",
  "python-dotenv==1.2.1",
  "edge-tts==7.2.7",
  "gTTS==2.5.4",
  "pyttsx3==2.99",
  "google-generativeai==0.8.6",
]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.1",
]

[project.scripts]
fsl-translate = "fsl.app:main"

[project.urls]
Homepage = "https://github.com/sc-lacanlale/Codewarts"
Repository = "https://github.com/sc-lacanlale/Codewarts"

[tool.setuptools]
packages = ["fsl", "apps"]
# LICENSE-DATA is the CC BY-NC 4.0 note for weights and recordings.
# The package licence is MIT only.
license-files = ["LICENSE"]

[tool.setuptools.package-dir]
fsl = "src/fsl"
apps = "apps"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "apps", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["fsl", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
